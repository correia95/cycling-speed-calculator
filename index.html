            "name": "Does this account for hills, wind, or stops?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No - this is average speed over the whole distance and time, treating the ride as constant. Real rides vary a lot within that average."
            }
          },
          {
            "@type": "Question",
            "name": "What's a typical cycling speed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It varies enormously by rider, terrain, and bike - there's no single \"typical\" figure. Use your own recent rides as a reference instead."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use this for a multi-stop route?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Only for the overall average across the whole trip - for a route with very different speed sections, calculate each section separately and add the times together."
            }
          }
        ]
